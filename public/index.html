<!DOCTYPE html> 
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Spese Modern</title>
    <!-- Importiamo Chart.js per il grafico a torta -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1, h2 {
            font-weight: 700;
        }

        /* Card moderne */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-bottom: 20px;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        /* Griglia per le nuove card analitiche */
        .analytics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .analytics-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Barra di avanzamento budget */
        .progress-bar-container {
            background: #e2e8f0;
            border-radius: 8px;
            height: 12px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-bar {
            background: var(--accent-green);
            height: 100%;
            width: 45%; /* Esempio dinamico */
            transition: width 0.4s ease;
        }

        /* Bottoni moderni */
        button {
            background-color: var(--accent-green);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
            width: 100%;
        }

        button:hover {
            background-color: var(--accent-green-hover);
        }

        button:active {
            transform: scale(0.97);
        }

        /* Animazione di comparsa */
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animated-item {
            animation: slideInUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📊 Il Mio Bilancio</h1>

        <!-- Sezione delle nuove Card Analitiche -->
        <div class="analytics-grid">
            <!-- Card 1: Budget Rimasto -->
            <div class="card animated-item">
                <h3>Budget Rimasto</h3>
                <p style="font-size: 24px; font-weight: bold; margin: 10px 0;">€ 650,00 <span style="font-size: 14px; color: var(--text-muted);">/ 1.000€</span></p>
                <div class="progress-bar-container">
                    <div class="progress-bar" style="width: 65%;"></div>
                </div>
                <p style="font-size: 12px; color: var(--text-muted); margin-top: 10px;">Hai speso il 35% del budget mensile</p>
            </div>

            <!-- Card 2: Grafico a Torta Categorie -->
            <div class="card animated-item">
                <h3>Spese per Categoria</h3>
                <div style="position: relative; height: 160px; display: flex; justify-content: center;">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Sezione principale esistente -->
        <div class="card animated-item">
            <h2>Inserisci Movimento</h2>
            <p style="color: var(--text-muted);">Qui andrà il modulo per aggiungere le spese come prima, ma con il nuovo stile pulito.</p>
            <button onclick="alert('Test pulsante moderno!')">Aggiungi Spesa</button>
        </div>
    </div>

    <script>
        // Inizializzazione del Grafico a Torta con Chart.js
        const ctx = document.getElementById('expenseChart').getContext('2d');
        const expenseChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Alimentari', 'Casa', 'Svago', 'Bollette'],
                datasets: [{
                    data: [40, 25, 20, 15],
                    backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#ef4444'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'right',
                        labels: {
                            boxWidth: 12,
                            font: { size: 11 }
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
