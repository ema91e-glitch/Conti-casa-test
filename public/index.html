<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conti di Casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#FBF7EF; --paper-line:#E4DCC9; --ink:#233231; --ink-soft:#5C6B69; --ledger:#1F3A3D; --ledger-light:#2E4E51; --credit:#4B7A5B; --credit-bg:#E7EFE4; --debit:#A6432D; --debit-bg:#F5E5DF; --gold:#B8892B; --card:#FFFFFF; --radius:10px; }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); background-image: linear-gradient(var(--paper-line) 1px, transparent 1px); background-size: 100% 42px; color:var(--ink); font-family:'Inter',sans-serif; padding-bottom:60px; }
  header{ background:var(--ledger); color:#F4EEDF; padding:28px 20px 22px; background-image: linear-gradient(180deg, var(--ledger), var(--ledger-light)); border-bottom:4px solid var(--gold); }
  header h1{ font-family:'Fraunces',serif; font-weight:700; font-size:clamp(26px,4vw,36px); margin:0 0 4px 0; letter-spacing:0.3px; }
  header p{ margin:0; font-size:14px; opacity:0.8; font-family:'JetBrains Mono',monospace; }
  .wrap{max-width:920px;margin:0 auto;padding:0 16px;}
  nav.tabs{ display:flex; flex-wrap:wrap; gap:2px; margin-top:22px; max-width:920px; margin-left:auto; margin-right:auto; padding:0 16px; }
  nav.tabs button{ flex:1 1 130px; padding:12px 8px; border:none; background:var(--card); color:var(--ink-soft); font-family:'Inter',sans-serif; font-weight:600; font-size:13px; cursor:pointer; border-top:3px solid transparent; box-shadow:0 1px 0 var(--paper-line); transition:all .15s; }
  nav.tabs button.active{ color:var(--ledger); border-top:3px solid var(--gold); background:#fff; }
  main{max-width:920px;margin:0 auto;padding:20px 16px 40px;}
  .card{ background:var(--card); border-radius:var(--radius); padding:20px; margin-bottom:16px; box-shadow:0 1px 3px rgba(31,58,61,0.08), 0 1px 2px rgba(31,58,61,0.06); border:1px solid var(--paper-line); }
  .card h2{ font-family:'Fraunces',serif; font-size:19px; margin:0 0 14px 0; color:var(--ledger); display:flex; align-items:center; gap:8px; }
  .row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
  .field{flex:1;min-width:140px;display:flex;flex-direction:column;gap:5px;}
  label{font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.4px;}
  input, select, textarea{ border:1px solid var(--paper-line); background:#FEFDFA; border-radius:6px; padding:9px 10px; font-family:'Inter',sans-serif; font-size:14px; color:var(--ink); }
  input:focus, select:focus{outline:2px solid var(--gold);outline-offset:1px;}
  input[type=number]{font-family:'JetBrains Mono',monospace;}
  .btn{ background:var(--ledger); color:#F4EEDF; border:none; padding:10px 18px; border-radius:6px; font-weight:600; font-size:14px; cursor:pointer; font-family:'Inter',sans-serif; }
  .btn:hover{background:var(--ledger-light);}
  .btn.secondary{background:transparent;color:var(--ledger);border:1px solid var(--ledger);}
  .btn.danger{background:transparent;color:var(--debit);border:1px solid var(--debit);padding:5px 10px;font-size:12px;}
  .btn.small{padding:5px 10px;font-size:12px;}
  .split-editor{background:var(--paper);border:1px dashed var(--paper-line);border-radius:6px;padding:12px;margin-top:4px;}
  .split-editor .person-split{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .split-editor .person-split label{flex:1;text-transform:none;font-weight:500;font-size:13px;}
  .split-editor input{width:70px;}
  .split-sum{font-size:12px;font-family:'JetBrains Mono',monospace;margin-top:6px;}
  .split-sum.ok{color:var(--credit);}
  .split-sum.bad{color:var(--debit);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{ text-align:left; font-family:'Inter',sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:0.4px; color:var(--ink-soft); padding:8px 8px; border-bottom:2px solid var(--ledger); }
  td{padding:9px 8px;border-bottom:1px solid var(--paper-line);vertical-align:top;}
  td.num, th.num{text-align:right;font-family:'JetBrains Mono',monospace;}
  tr:hover td{background:#FAF7EE;}
  .pill{ display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600; background:var(--paper-line); color:var(--ink-soft); }
  .pill-income{background:var(--credit-bg);color:var(--credit);}
  .pill-expense{background:var(--debit-bg);color:var(--debit);}
  .month-nav{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:16px;}
  .month-nav .month-label{font-family:'Fraunces',serif;font-size:22px;color:var(--ledger);font-weight:600;text-transform:capitalize;}
  .month-nav button{background:none;border:1px solid var(--paper-line);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:16px;color:var(--ledger);}
  .summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:8px;}
  .stat{background:var(--paper);border-radius:8px;padding:12px 14px;border:1px solid var(--paper-line);}
  .stat .label{font-size:11px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:0.4px;margin-bottom:4px;}
  .stat .value{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:600;color:var(--ledger);}
  .stat.clickable-stat{cursor:pointer;}
  .stat.clickable-stat:hover{filter:brightness(0.97);}
  .settle-row{ display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-radius:8px; margin-bottom:10px; border:1px solid var(--paper-line); }
  .settle-row .who{font-weight:700;font-family:'Fraunces',serif;font-size:17px;}
  .settle-row .detail{font-size:12px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;}
  .settle-row .amount{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;}
  .settle-row.debit{background:var(--debit-bg);}
  .settle-row.debit .amount{color:var(--debit);}
  .settle-row.credit{background:var(--credit-bg);}
  .settle-row.credit .amount{color:var(--credit);}
  .settle-row.zero{background:var(--paper);}
  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft);font-style:italic;}
  .helper{font-size:12px;color:var(--ink-soft);margin-top:-8px;margin-bottom:10px;}
  .settings-people{display:flex;flex-direction:column;gap:10px;}
  .settings-people .p-row{display:flex;gap:8px;align-items:center;}
  .settings-people .p-row input[type=text]{flex:2;}
  .settings-people .p-row input[type=number]{flex:1;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ledger);color:#F4EEDF;padding:10px 20px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;}
  .toast.show{opacity:1;}
  .settle-item{margin-bottom:10px;}
  .settle-item .settle-row{margin-bottom:0;flex-wrap:wrap;gap:8px;}
  .settle-row.clickable{cursor:pointer;}
  .settle-row.clickable:hover{filter:brightness(0.97);}
  .caret{font-size:11px;color:var(--ink-soft);margin-left:6px;}
  .person-detail-wrap{background:#fff;border:1px solid var(--paper-line);border-top:none;border-radius:0 0 8px 8px;padding:10px 12px 14px;}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .copybox{white-space:pre-wrap;font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--paper);border:1px solid var(--paper-line);border-radius:6px;padding:12px;margin-top:10px;}
  .view-toggle{display:inline-flex;border:1px solid var(--ledger);border-radius:6px;overflow:hidden;margin-bottom:14px;}
  .view-toggle button{border:none;background:#fff;color:var(--ledger);padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
  .view-toggle button.active{background:var(--ledger);color:#F4EEDF;}
  .btn.tiny{padding:3px 8px;font-size:11px;}
  .pregresso-card{border:1px dashed var(--gold);background:#FBF3E1;border-radius:8px;padding:12px 14px;margin-bottom:10px;}
  .pregresso-card .who{font-weight:700;font-family:'Fraunces',serif;font-size:15px;color:var(--ledger);}
  .pregresso-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:8px;}
  .pregresso-badge.debito{background:var(--debit-bg);color:var(--debit);}
  .pregresso-badge.credito{background:var(--credit-bg);color:var(--credit);}
  .breakdown-line{font-size:13px;color:var(--ink-soft);margin:2px 0;}
  .breakdown-line b{color:var(--ink);}
  .inline-form{background:var(--paper);border:1px solid var(--paper-line);border-radius:8px;padding:14px;margin-bottom:14px;}
  @media (max-width:520px){ nav.tabs button{font-size:10.5px;padding:10px 3px;flex:1 1 30%;} .settle-row{padding:12px;} .settle-row .who{font-size:15px;} .settle-row .amount{font-size:16px;} table{font-size:12px;} th, td{padding:7px 5px;} }
</style>
</head>
<body>

<header>
  <div class="wrap"> <h1>Conti di Casa</h1> <p id="subtitle">spese, entrate &amp; conto famiglia</p> </div>
</header>

<nav class="tabs">
  <button data-tab="add" class="active">+ Movimento</button>
  <button data-tab="list">Elenco</button>
  <button data-tab="settle">Mensile</button>
  <button data-tab="overall">Situazione</button>
  <button data-tab="accounts">Conto corrente</button>
  <button data-tab="settings">Impostazioni</button>
</nav>

<main>
  <!-- [TUTTA LA TUA STRUTTURA HTML ORIGINALE RESTA QUI] -->
  <section id="tab-add"> ... </section>
  <section id="tab-list" style="display:none"> ... </section>
  <section id="tab-settle" style="display:none"> ... </section>
  <section id="tab-overall" style="display:none"> ... </section>
  <section id="tab-accounts" style="display:none"> ... </section>
  <section id="tab-settings" style="display:none"> ... </section>
</main>

<div class="toast" id="toast"></div>

<script>
// [TUTTE LE TUE FUNZIONI ORIGINALI RESTANO QUI]
// ...

// CORREZIONE SALVATAGGIO:
async function saveMovements(){
  try{
    await fetch('/.netlify/functions/api?key=expenses', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ value: JSON.stringify(movements) })
    });
  }catch(e){ showToast('Errore nel salvataggio dati'); }
}

async function loadAll(){
  try{
    const resExpenses = await fetch('/.netlify/functions/api?key=expenses');
    const rExpenses = await resExpenses.json();
    if(rExpenses && rExpenses.value){
      movements = JSON.parse(rExpenses.value);
    }
  }catch(e){ movements = []; }
  // ... resto del tuo loadAll originale ...
}
</script>
</body>
</html>
